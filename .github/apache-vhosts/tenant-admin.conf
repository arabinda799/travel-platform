# Apache vhost for tenant-admin
# Place at: /etc/httpd/conf.d/tenant-admin.conf  (or /etc/apache2/sites-available/)
# Handles:  *.easyflys.com  AND  any custom domain tenants point to your server IP
#
# How custom tenant domains work:
#   Tenant adds a DNS CNAME:  theircompany.com  →  server.easyflys.com
#   Apache catches it here via ServerAlias *
#   Same Angular build serves all tenant domains

<VirtualHost *:80>
    ServerName app.easyflys.com
    ServerAlias *.easyflys.com
    ServerAlias *
    DocumentRoot /home/easyflysnode/apps/tenant-admin/dist

    <Directory /home/easyflysnode/apps/tenant-admin/dist>
        Options -Indexes +FollowSymLinks
        AllowOverride All
        Require all granted

        # Angular HTML5 routing — redirect all 404s to index.html
        RewriteEngine On
        RewriteBase /
        RewriteRule ^index\.html$ - [L]
        RewriteCond %{REQUEST_FILENAME} !-f
        RewriteCond %{REQUEST_FILENAME} !-d
        RewriteRule . /index.html [L]
    </Directory>

    ErrorLog /var/log/httpd/tenant-admin-error.log
    CustomLog /var/log/httpd/tenant-admin-access.log combined
</VirtualHost>
