# Apache vhost for platform-admin
# Place at: /etc/httpd/conf.d/platform-admin.conf  (or /etc/apache2/sites-available/)
# Domain:   admin.easyflys.com

<VirtualHost *:80>
    ServerName admin.easyflys.com
    DocumentRoot /home/easyflysnode/apps/platform-admin/dist

    <Directory /home/easyflysnode/apps/platform-admin/dist>
        Options -Indexes +FollowSymLinks
        AllowOverride All
        Require all granted

        # Angular HTML5 routing — redirect all 404s to index.html
        RewriteEngine On
        RewriteBase /
        RewriteRule ^index\.html$ - [L]
        RewriteCond %{REQUEST_FILENAME} !-f
        RewriteCond %{REQUEST_FILENAME} !-d
        RewriteRule . /index.html [L]
    </Directory>

    ErrorLog /var/log/httpd/platform-admin-error.log
    CustomLog /var/log/httpd/platform-admin-access.log combined
</VirtualHost>
