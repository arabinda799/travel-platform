@if (isMaintenance()) {
  <div class="maintenance-board">
    <div class="maintenance-card">
      <div class="maintenance-icon-wrap">
        <span class="icon">engineering</span>
      </div>
      <h1 class="maintenance-title">System Under Maintenance</h1>
      <p class="maintenance-desc">
        {{ maintenanceMsg() }}
      </p>
      <button type="button" class="maintenance-retry-btn" (click)="retryLoad()">
        <span class="icon">refresh</span>
        Retry Connection
      </button>
    </div>
  </div>
} @else if (isAuthRoute()) {
  <router-outlet></router-outlet>
} @else {
  <lib-admin-layout
    [navItems]="navItems"
    userName="Tenant Admin"
    userRole="Agency Manager"
    systemStatus="Tenant Portal">
    <div sidebar-brand class="brand-container" [title]="companyName()">
      @if (brandLogo()) {
        <img [src]="trimmedBrandLogo() || brandLogo()" [alt]="companyName()" class="brand-logo-img brand-logo-full" />
        @if (brandFavicon()) {
          <img [src]="trimmedBrandFavicon() || brandFavicon()" [alt]="companyName()" class="brand-logo-img brand-logo-icon" />
        }
      } @else if (brandFavicon()) {
        <img [src]="trimmedBrandFavicon() || brandFavicon()" [alt]="companyName()" class="brand-logo-img brand-logo-full" />
      } @else {
        <span class="icon brand-icon">flight_takeoff</span>
        <span class="brand-text nav-label">Easy<span class="brand-accent">Flys</span></span>
      }
    </div>
    <router-outlet></router-outlet>
  </lib-admin-layout>
}
