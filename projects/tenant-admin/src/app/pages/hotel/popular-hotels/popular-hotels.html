<lib-page-container
  title="Popular Hotels"
  subtitle="Manage featured hotels displayed on the booking homepage"
  [breadcrumbs]="breadcrumbs">

  <div page-actions>
    <lib-button variant="primary" icon="add" (click)="openAddModal()">
      Add Hotel
    </lib-button>
  </div>

  <lib-data-table
    [value]="filteredHotels()"
    [columns]="columns()"
    [totalRecords]="filteredHotels().length"
    [loading]="loading()"
    [checkbox]="true"
    [(selection)]="selectedItems"
    [searchable]="true"
    searchPlaceholder="Search by hotel name..."
    (search)="onSearch($event)">

    <div table-actions class="table-actions-group">
      <lib-button
        variant="outline"
        icon="tune"
        [badge]="activeFilterCount() ? activeFilterCount() : ''"
        (click)="filterVisible.set(true)">
        Filters
      </lib-button>
    </div>

    <div selection-actions class="selection-actions-group">
      <lib-button variant="outline-warning" icon="sync" (click)="openBulkStatusModal()">
        Change Status
      </lib-button>
      <lib-button variant="danger" icon="delete" (click)="confirmBulkDelete()">
        Delete Selected ({{ selectedItems().length }})
      </lib-button>
    </div>

    <!-- Hotel thumbnail -->
    <ng-template #imageTpl let-row>
      <div class="hotel-thumb-wrapper">
        <lib-thumb-image [src]="row.imageUrl" [alt]="row.title" fallbackIcon="hotel" />
      </div>
    </ng-template>

    <!-- Hotel name cell -->
    <ng-template #titleTpl let-row>
      <strong class="hotel-title">{{ row.title ?? '—' }}</strong>
    </ng-template>

    <!-- Status badge -->
    <ng-template #statusTpl let-row>
      <lib-status-badge [status]="row.isActive ? 'Active' : 'Inactive'" />
    </ng-template>

    <!-- Row actions -->
    <ng-template #actionsTpl let-row>
      <div class="table-row-actions">
        <lib-table-action action="edit" tooltip="Edit Hotel" (clicked)="openEditModal(row)" />
        <lib-table-action action="delete" tooltip="Remove Hotel" (clicked)="confirmDeleteSingle(row)" />
      </div>
    </ng-template>

  </lib-data-table>

</lib-page-container>

<!-- ─── Filter Sidebar ─── -->
<lib-filter-sidebar
  [(visible)]="filterVisible"
  (apply)="onApplyFilters()"
  (reset)="onResetFilters()">

  <div class="filter-group">
    <lib-select-field
      label="Status"
      [options]="statusOptions"
      [value]="selectedStatusFilter()"
      (valueChange)="selectedStatusFilter.set($event)"
      placeholder="All Statuses"
      [clearable]="true" />
  </div>

</lib-filter-sidebar>

<!-- ─── Add / Edit Modal ─── -->
<lib-form-modal
  [(visible)]="modalVisible"
  [title]="isEditing() ? 'Edit Popular Hotel' : 'Add Popular Hotel'"
  [subtitle]="isEditing() ? 'Update hotel details and display settings' : 'Add a hotel to the popular section on the booking homepage'"
  [icon]="isEditing() ? 'edit' : 'add_business'"
  width="44rem"
  submitLabel="Save"
  submitIcon="save"
  (submitted)="onSave()">

  <div class="hotel-form-grid">

    <!-- Hotel Name -->
    <div class="form-row">
      <lib-text-field
        label="Hotel Name"
        placeholder="e.g. Taj Palace New Delhi"
        [formControl]="form.controls.title"
        [required]="true"
        hint="Max 200 characters — will be selectable from hotel inventory in a future update" />
    </div>

    <!-- Image -->
    <div class="form-row">
      <lib-file-upload-field
        label="Hotel Image"
        accept="image/*"
        [formControl]="form.controls.imageUrl"
        [fileName]="formImageFileName()"
        (fileNameChange)="formImageFileName.set($event)"
        hint="Recommended: 4:3 or 16:9 landscape image" />
    </div>

    <!-- Sort Order + Status -->
    <div class="form-row two-cols">
      <lib-text-field
        label="Sort Order"
        type="number"
        placeholder="1"
        [formControl]="form.controls.sortOrder"
        [required]="true"
        hint="Lower number = displayed first on homepage" />

      @if (isEditing()) {
        <lib-select-field
          label="Status"
          [options]="statusOptions"
          [formControl]="form.controls.status"
          [required]="true" />
      }
    </div>

  </div>

</lib-form-modal>

<!-- ─── Bulk Status Modal ─── -->
<lib-status-modal
  [(visible)]="statusModalVisible"
  [count]="selectedItems().length"
  [options]="[
    { label: 'Active', value: 'Active', description: 'Show hotel on homepage popular section' },
    { label: 'Inactive', value: 'Inactive', description: 'Hide hotel from public view' }
  ]"
  (confirmed)="onBulkStatusConfirm($event)" />

<!-- ─── Confirm Delete ─── -->
<lib-confirm-dialog
  [(visible)]="confirmDeleteVisible"
  [title]="itemToDelete() ? 'Remove Hotel' : 'Remove Selected Hotels'"
  [message]="itemToDelete() ? 'Are you sure you want to remove &quot;' + itemToDelete()!.title + '&quot; from popular hotels?' : 'Are you sure you want to remove the ' + selectedItems().length + ' selected hotels? This action cannot be undone.'"
  confirmLabel="Remove"
  severity="danger"
  (confirmed)="executeDelete()" />
