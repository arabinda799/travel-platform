<lib-page-container
  title="Newsletter Subscribers"
  subtitle="Manage newsletter subscribers, track subscriptions, and export email lists"
  [breadcrumbs]="breadcrumbs">

  <div page-actions>
    <lib-button variant="primary" icon="add" (click)="openAddModal()">
      Add Subscriber
    </lib-button>
  </div>

  <lib-data-table
    [value]="filteredSubscribers()"
    [columns]="columns()"
    [totalRecords]="filteredSubscribers().length"
    [loading]="loading()"
    [checkbox]="true"
    [(selection)]="selectedSubscribers"
    [searchable]="true"
    searchPlaceholder="Search by name or email..."
    (search)="onSearch($event)">

    <div table-actions class="table-actions-group">
      <lib-button
        variant="outline"
        icon="tune"
        [badge]="activeFilterCount() ? activeFilterCount() : ''"
        (click)="filterVisible.set(true)">
        Filters
      </lib-button>
    </div>

    <div selection-actions class="selection-actions-group">
      <lib-button variant="outline" icon="download" (click)="exportData(true)">
        Export Selected ({{ selectedSubscribers().length }})
      </lib-button>
      <lib-button variant="danger" icon="delete" (click)="confirmBulkDelete()">
        Delete Selected ({{ selectedSubscribers().length }})
      </lib-button>
    </div>

    <!-- Name -->
    <ng-template #nameTpl let-row>
      @if (row.name) {
        <span class="subscriber-name">{{ row.name }}</span>
      } @else {
        <span class="empty-cell">—</span>
      }
    </ng-template>

    <!-- Email -->
    <ng-template #emailTpl let-row>
      <div class="email-cell">
        <span class="icon">mail</span>
        <span class="email-text">{{ row.email }}</span>
      </div>
    </ng-template>

    <!-- Status badge -->
    <ng-template #statusTpl let-row>
      <lib-status-badge
        [status]="row.status === 'Subscribed' ? 'Active' : 'Inactive'"
        [label]="row.status" />
    </ng-template>

    <!-- Row actions -->
    <ng-template #actionsTpl let-row>
      <div class="table-row-actions">
        <lib-table-action action="edit" tooltip="Edit Subscriber" (clicked)="openEditModal(row)" />
        <lib-table-action action="delete" tooltip="Remove Subscriber" (clicked)="confirmDeleteSingle(row)" />
      </div>
    </ng-template>

  </lib-data-table>

</lib-page-container>

<!-- ─── Filter Sidebar ─── -->
<lib-filter-sidebar
  [(visible)]="filterVisible"
  (apply)="onApplyFilters()"
  (reset)="onResetFilters()">

  <div class="filter-group">
    <lib-select-field
      label="Subscription Status"
      [options]="subscriptionStatusOptions"
      [value]="selectedStatusFilter()"
      (valueChange)="selectedStatusFilter.set($event)"
      placeholder="All Statuses"
      [clearable]="true" />
  </div>

  <div class="filter-group">
    <lib-datepicker-field
      label="Subscribed Date Range"
      selectionMode="range"
      dateFormat="dd/mm/yy"
      placeholder="Select start and end date"
      [value]="selectedDateRangeFilter()"
      (valueChange)="selectedDateRangeFilter.set($event)" />
  </div>

</lib-filter-sidebar>

<!-- ─── Add / Edit Modal ─── -->
<lib-form-modal
  [(visible)]="modalVisible"
  [title]="isEditing() ? 'Edit Subscriber' : 'Add New Subscriber'"
  [subtitle]="isEditing() ? 'Update subscriber details and subscription status' : 'Register a new newsletter subscriber'"
  [icon]="isEditing() ? 'edit' : 'person_add'"
  width="32rem"
  submitLabel="Save"
  submitIcon="save"
  (submitted)="onSaveSubscriber()">

  <div class="subscriber-form-grid">

    <div class="form-row">
      <lib-text-field
        label="Full Name (Optional)"
        placeholder="e.g. Rishi Ram Shukla"
        [formControl]="form.controls.name" />
    </div>

    <div class="form-row">
      <lib-text-field
        label="Email ID"
        type="email"
        placeholder="e.g. subscriber@example.com"
        [formControl]="form.controls.email"
        [required]="true"
        hint="Newsletter updates will be sent to this address" />
    </div>

    <div class="form-row">
      <lib-select-field
        label="Subscription Status"
        [options]="subscriptionStatusOptions"
        [formControl]="form.controls.status"
        [required]="true" />
    </div>

  </div>

</lib-form-modal>

<!-- ─── Confirm Delete ─── -->
<lib-confirm-dialog
  [(visible)]="confirmDeleteVisible"
  [title]="itemToDelete() ? 'Remove Subscriber' : 'Remove Selected Subscribers'"
  [message]="itemToDelete() ? 'Are you sure you want to remove &quot;' + itemToDelete()?.email + '&quot; from the newsletter list?' : 'Are you sure you want to remove the ' + selectedSubscribers().length + ' selected subscribers?'"
  confirmLabel="Remove"
  severity="danger"
  (confirmed)="executeDelete()" />
