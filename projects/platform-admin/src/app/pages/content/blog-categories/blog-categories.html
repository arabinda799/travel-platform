<lib-page-container
  title="Blog Categories"
  subtitle="Manage blog categories for the content section"
  [breadcrumbs]="[
    { label: 'Dashboard', route: '/dashboard' },
    { label: 'Content' },
    { label: 'Blog Categories' }
  ]">

  <div page-actions>
    <lib-button variant="primary" icon="add" (click)="openAddModal()">
      Add Category
    </lib-button>
  </div>

  <lib-data-table
    [value]="filteredItems()"
    [columns]="columns()"
    [totalRecords]="service.total()"
    [rows]="50"
    [loading]="service.loading()"
    [searchable]="true"
    searchPlaceholder="Search by name..."
    (search)="onSearch($event)"
    (lazyLoad)="onLazyLoad($event)">

    <ng-template #statusTpl let-row>
      <lib-status-badge [status]="row.status === 'Active' ? 'ACTIVE' : 'INACTIVE'" />
    </ng-template>

    <ng-template #actionsTpl let-row>
      <div class="table-row-actions">
        <lib-table-action action="edit" tooltip="Edit" (clicked)="openEditModal(row)" />
        <lib-table-action action="delete" tooltip="Delete" (clicked)="confirmDelete(row)" />
      </div>
    </ng-template>
  </lib-data-table>

  <lib-form-modal
    [(visible)]="modalVisible"
    [loading]="isSaving()"
    [title]="isEditing() ? 'Edit Category' : 'Add Category'"
    [submitLabel]="isEditing() ? 'Update' : 'Save'"
    submitIcon="save"
    (submitted)="save()">
    <div class="modal-form-grid">
      <lib-file-upload-field
        label="Category Image"
        accept="image/*"
        [formControl]="form.controls.image"
        [(fileName)]="formImageFileName"
        hint="Recommended: square or 4:3 image" />
      <div class="modal-form-grid-2col">
        <lib-text-field label="Name" placeholder="e.g. Travel Tips" [required]="true" [formControl]="form.controls.name" (input)="onNameInput()" />
        <lib-text-field label="Slug" placeholder="e.g. travel-tips" [required]="true" [formControl]="form.controls.slug" />
      </div>
      <lib-text-field label="Description" placeholder="Category description" [formControl]="form.controls.description" />
      <lib-select-field
        label="Status"
        [required]="true"
        [options]="[{ label: 'Active', value: 'Active' }, { label: 'Inactive', value: 'Inactive' }]"
        [formControl]="form.controls.status" />
    </div>
  </lib-form-modal>

  <lib-confirm-dialog
    [(visible)]="confirmDeleteVisible"
    title="Delete Category"
    [message]="itemToDelete() ? 'Delete &quot;' + itemToDelete()!.name + '&quot;?' : ''"
    confirmLabel="Delete"
    severity="danger"
    (confirmed)="executeDelete()" />

</lib-page-container>
