<lib-page-container
  title="Blog Posts"
  subtitle="Manage blog articles published on the platform"
  [breadcrumbs]="[
    { label: 'Dashboard', route: '/dashboard' },
    { label: 'Content' },
    { label: 'Blog Posts' }
  ]">

  <div page-actions>
    <lib-button variant="primary" icon="add" (click)="openAddModal()">
      Add Blog Post
    </lib-button>
  </div>

  <lib-data-table
    [value]="filteredItems()"
    [columns]="columns()"
    [totalRecords]="service.total()"
    [rows]="50"
    [loading]="service.loading()"
    [searchable]="true"
    searchPlaceholder="Search by title or category..."
    (search)="onSearch($event)"
    (lazyLoad)="onLazyLoad($event)">

    <ng-template #statusTpl let-row>
      <lib-status-badge [status]="row.status === 'Active' ? 'ACTIVE' : 'INACTIVE'" />
    </ng-template>

    <ng-template #actionsTpl let-row>
      <div class="table-row-actions">
        <lib-table-action action="edit" tooltip="Edit" (clicked)="openEditModal(row)" />
        <lib-table-action action="delete" tooltip="Delete" (clicked)="confirmDelete(row)" />
      </div>
    </ng-template>
  </lib-data-table>

  <lib-form-modal
    [(visible)]="modalVisible"
    [loading]="isSaving()"
    [title]="isEditing() ? 'Edit Blog Post' : 'Add Blog Post'"
    [submitLabel]="isEditing() ? 'Update' : 'Save'"
    submitIcon="save"
    (submitted)="save()">
    <div class="modal-form-grid">
      <lib-file-upload-field
        label="Cover Image"
        accept="image/*"
        [formControl]="form.controls.image"
        [(fileName)]="formImageFileName"
        hint="Recommended: 16:9 landscape image" />
      <div class="modal-form-grid-2col">
        <lib-text-field label="Title" placeholder="Blog post title" [required]="true" [formControl]="form.controls.title" (input)="onTitleInput()" />
        <lib-text-field label="Slug" placeholder="e.g. my-blog-post" [required]="true" [formControl]="form.controls.slug" />
      </div>
      <div class="modal-form-grid-2col">
        <lib-select-field
          label="Category"
          placeholder="Select category..."
          [filter]="true"
          [clearable]="true"
          [options]="categoryOptions()"
          [formControl]="form.controls.categoryName" />
        <lib-text-field label="Author" placeholder="Author name" [formControl]="form.controls.postedBy" />
      </div>
      <lib-text-field label="Description" placeholder="Blog content or excerpt" [formControl]="form.controls.description" />
      <lib-select-field
        label="Status"
        [required]="true"
        [options]="[{ label: 'Active', value: 'Active' }, { label: 'Inactive', value: 'Inactive' }]"
        [formControl]="form.controls.status" />
    </div>
  </lib-form-modal>

  <lib-confirm-dialog
    [(visible)]="confirmDeleteVisible"
    title="Delete Blog Post"
    [message]="itemToDelete() ? 'Delete &quot;' + itemToDelete()!.title + '&quot;?' : ''"
    confirmLabel="Delete"
    severity="danger"
    (confirmed)="executeDelete()" />

</lib-page-container>
