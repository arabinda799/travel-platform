<lib-page-container
  title="Popular Hotels"
  subtitle="Manage featured hotels shown on the booking app homepage"
  [breadcrumbs]="[
    { label: 'Dashboard', route: '/dashboard' },
    { label: 'Hotel Management' },
    { label: 'Popular Hotels' }
  ]">

  <div page-actions>
    <lib-button variant="primary" icon="hotel" (click)="openAddModal()">
      Add Hotel
    </lib-button>
  </div>

  <lib-data-table
    [value]="filteredItems()"
    [columns]="columns()"
    [totalRecords]="service.total()"
    [rows]="50"
    [loading]="service.loading()"
    [searchable]="true"
    searchPlaceholder="Search by name..."
    (search)="onSearch($event)"
    (lazyLoad)="onLazyLoad($event)">

    <ng-template #imageTpl let-row>
      @if (row.imageUrl) {
        <img [src]="row.imageUrl" alt="" class="list-thumb" />
      } @else {
        <span class="text-muted-dash">—</span>
      }
    </ng-template>

    <ng-template #statusTpl let-row>
      <lib-status-badge [status]="row.isActive ? 'ACTIVE' : 'INACTIVE'" />
    </ng-template>

    <ng-template #actionsTpl let-row>
      <div class="table-row-actions">
        <lib-table-action action="edit" tooltip="Edit" (clicked)="openEditModal(row)" />
        <lib-table-action action="delete" tooltip="Delete" (clicked)="confirmDelete(row)" />
      </div>
    </ng-template>
  </lib-data-table>

  <lib-form-modal
    [(visible)]="modalVisible"
    [loading]="isSaving()"
    [title]="isEditing() ? 'Edit Hotel' : 'Add Hotel'"
    [submitLabel]="isEditing() ? 'Update' : 'Save'"
    submitIcon="save"
    (submitted)="save()">
    <div class="modal-form-grid">
      <lib-file-upload-field
        label="Hotel Image"
        accept="image/*"
        [formControl]="form.controls.imageUrl"
        [(fileName)]="formImageFileName"
        hint="Recommended: 4:3 or 16:9 landscape image" />
      <div class="ratehawk-autocomplete-wrapper">
        <lib-text-field
          label="Search RateHawk Hotel"
          placeholder="Type hotel name (e.g. Taj, Marriott, Hilton)..."
          [value]="hotelSearchQuery()"
          (valueChange)="onHotelSearchInput($event)"
          hint="Search real hotels in RateHawk database to auto-fill Hotel Name" />

        @if (searchingHotels()) {
          <div class="ratehawk-searching-status">
            <span class="icon searching-icon">sync</span>
            Searching RateHawk hotels...
          </div>
        }

        @if (hotelSuggestions().length > 0) {
          <div class="autocomplete-dropdown-panel">
            @for (hotel of hotelSuggestions(); track hotel.id) {
              <div
                (click)="selectHotel(hotel)"
                class="autocomplete-item">
                <div>
                  <div class="autocomplete-title-row">
                    <span class="item-title">{{ hotel.name }}</span>
                    @if (hotel.starRating) {
                      <span class="item-rating">★ {{ hotel.starRating }}</span>
                    }
                  </div>
                  <span class="item-sub item-sub--flush">{{ hotel.address }}</span>
                </div>
              </div>
            }
          </div>
        }
      </div>

      <div class="modal-form-grid-2col">
        <lib-text-field label="Hotel Name" placeholder="e.g. Taj Palace New Delhi" [required]="true" [formControl]="form.controls.title" />
        <lib-text-field label="Sort Order" type="number" placeholder="1" [formControl]="form.controls.sortOrder" />
      </div>
      <lib-select-field
        label="Status"
        [required]="true"
        [options]="[{ label: 'Active', value: true }, { label: 'Inactive', value: false }]"
        [formControl]="form.controls.isActive" />
    </div>
  </lib-form-modal>

  <lib-confirm-dialog
    [(visible)]="confirmDeleteVisible"
    title="Delete Hotel"
    [message]="itemToDelete() ? 'Delete &quot;' + itemToDelete()!.title + '&quot;?' : ''"
    confirmLabel="Delete"
    severity="danger"
    (confirmed)="executeDelete()" />

</lib-page-container>
