<p-dialog
  [(visible)]="visible"
  [modal]="true"
  [closable]="true"
  [draggable]="false"
  [resizable]="false"
  [style]="{ width: '27rem', maxWidth: '95vw' }"
  styleClass="app-modal confirm-dialog"
  appendTo="body">

  <ng-template #header>
    <lib-modal-header [icon]="icon()" [title]="title()" />
  </ng-template>

  <div class="confirm-body">
    <p class="confirm-message">{{ message() }}</p>

    @if (count() > 0) {
      <div class="confirm-meta-box">
        <span class="icon">info</span>
        <span>Affects <strong>{{ count() }}</strong> selected {{ count() === 1 ? 'record' : 'records' }}</span>
      </div>
    }
  </div>

  <ng-template #footer>
    <div class="modal-footer-actions">
      <lib-button variant="outline" (click)="onCancel()">
        {{ cancelLabel() }}
      </lib-button>
      <lib-button
        [variant]="confirmVariant()"
        [icon]="confirmVariant() === 'danger' ? 'delete' : 'check'"
        (click)="onConfirm()">
        {{ confirmLabel() }}
      </lib-button>
    </div>
  </ng-template>
</p-dialog>
